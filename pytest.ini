# pytest.ini
# Configuración de pytest para StoneFixer
# Ubicación: raíz del proyecto backend

[pytest]
# Patrones de archivos de test
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directorios de tests
testpaths = tests

# Marcadores personalizados
markers =
    unit: Tests unitarios (lógica de negocio)
    integration: Tests de integración (endpoints HTTP)
    e2e: Tests end-to-end (flujos completos)
    slow: Tests lentos (>1 segundo)
    smoke: Tests de humo (críticos para CI/CD)
    db: Tests que requieren base de datos
    auth: Tests de autenticación y autorización

# Opciones por defecto
addopts =
    # Mostrar resumen detallado
    -ra
    # Mostrar prints durante los tests
    -s
    # Modo verbose
    -v
    # Mostrar warnings
    --tb=short
    # Cobertura de código
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    # Parallel execution (requiere pytest-xdist)
    # -n auto

# Mínimo porcentaje de cobertura requerido
# --cov-fail-under=80

# Filtros de warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout para tests (requiere pytest-timeout)
# timeout = 300

# Configuración de fixtures
# usefixtures = session

[coverage:run]
# Archivos a incluir en cobertura
source = app

# Archivos a excluir
omit =
    */tests/*
    */venv/*
    */migrations/*
    */__pycache__/*
    */config.py

[coverage:report]
# Excluir líneas con estos patrones
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Mostrar líneas faltantes
show_missing = true

# Precisión de porcentajes
precision = 2